<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll con Header Trasparente</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    /* Header fisso e trasparente */
    header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px; /* Altezza dell'header */
        background-color: rgba(255, 255, 255, 0.8);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        z-index: 1000;
    }

    /* Spazio per compensare l'header */
    main {
        margin-top: 80px; /* Stessa altezza dell'header */
    }

    /* Div specifico */
    .special-div {
        height: 300px; /* Altezza del div */
        background-color: #de1212;
        overflow: hidden; /* Nasconde il contenuto che scorre sopra */
        position: relative;
        z-index: 0;
    }

    /* Contenuto scrollabile dentro il div */
    .special-div-content {
        padding-top: 80px; /* Altezza header per compensare */
        height: 200px; /* Altezza contenuto */
        overflow-y: auto; /* Rende il contenuto scrollabile internamente */
    }

    /* Contenuto extra per simulare scrolling */
    .content {
        height: 2000px;
        background: linear-gradient(to bottom, #f8f8f8, #ddd);
    }
</style>
</head>
<body>

<header>
    <h1>Header Trasparente</h1>
</header>

<main>
    <div class="special-div">
        <div class="special-div-content">
            <p>Contenuto che non si vede oltre lo header...</p>
        </div>
    </div>
    <div class="content">
        <p>Altri contenuti che scorrono normalmente...</p>
    </div>
</main>

</body>
</html>
