<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button with Dropdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .container {
            position: relative;
        }

        #toggleButton {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .dropdown-list {
            display: none; /* La lista è nascosta inizialmente */
            position: absolute;
            top: -60px; /* Posiziona la lista a 15px sopra il bottone */
            left: 50%; /* Allinea la lista con il centro del bottone */
            transform: translateX(-50%); /* Centra la lista rispetto al bottone */
            display: flex; /* Disporre i bottoni orizzontalmente */
            gap: 15px; /* Distanza tra i bottoni */
            z-index: 10;
            opacity: 0; /* La lista è invisibile inizialmente */
            transform: translateY(-20px); /* La lista inizia sopra il bottone */
            animation: dropdownAnimation 0.8s ease forwards; /* Animazione di ingresso */
        }

        @keyframes dropdownAnimation {
            0% {
                opacity: 0;
                transform: translateY(0px) translateX(-50%) scaleY(0) scaleX(0); /* Inizia invisibile e sopra */
            }
            100% {
                opacity: 1; /* Diventa visibile */
                transform: translateY(-20px) translateX(-50%) scaleY(1) scaleX(1); /* Posizione finale centrata sopra il bottone */
            }
        }

        .item {
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }

        .item:hover {
            background-color: #f1f1f1;
        }

        /* Animazione per la scomparsa */
        .hide {
            animation: dropdownHideAnimation 0.5s ease forwards;
        }

        @keyframes dropdownHideAnimation {
            0% {
                opacity: 1;
                transform: translateY(-20px)  translateX(-50%) scaleY(1) scaleX(1);
            }
            100% {
                opacity: 0;
                transform: translateY(0px)  translateX(-50%)  scaleY(0) scaleX(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="toggleButton">Mostra lista</button>
        <div id="dropdownList" class="dropdown-list" style="display: none;">
            <div class="item">Elemento 1</div>
            <div class="item">Elemento 2</div>
            <div class="item">Elemento 3</div>
            <div class="item">Elemento 4</div>
        </div>
    </div>

    <script>
        document.getElementById('toggleButton').addEventListener('click', function() {
            var dropdownList = document.getElementById('dropdownList');
            
            // Se la lista non è visibile, aggiungi la classe per animarla in ingresso
            if (dropdownList.style.display === 'none' || dropdownList.style.display === '') {
                dropdownList.style.display = 'flex'; // Mostra la lista come flex per disporre i bottoni orizzontalmente
                dropdownList.classList.remove('hide'); // Rimuovi l'animazione di uscita
                dropdownList.offsetHeight; // Forza il reflow per l'animazione
                dropdownList.classList.add('show'); // Aggiungi l'animazione di ingresso
            } else {
                dropdownList.classList.add('hide'); // Aggiungi l'animazione di uscita
                dropdownList.addEventListener('animationend', function() {
                    dropdownList.style.display = 'none'; // Nascondi la lista alla fine dell'animazione
                    dropdownList.classList.remove('hide'); // Ripristina il CSS originale
                }, { once: true });
            }
        });
    </script>
</body>
</html>
